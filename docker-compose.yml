services:
  licenseserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: licence-product:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "7575:7575"
    extra_hosts:
      # Lets the container resolve host.docker.internal on Linux too (Docker
      # Desktop on Mac/Windows already provides this out of the box).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7575/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
