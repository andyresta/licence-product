{{define "layout"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — licence-product admin</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f5f6f8; color: #1a1a1a; }
    header { background: #1e293b; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    header a { color: #fff; text-decoration: none; font-weight: 700; }
    header form { margin: 0; }
    header button { background: none; border: 1px solid #64748b; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
    th { color: #64748b; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 4px; color: #334155; }
    .field input, .field select, .field textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .field-row { display: flex; gap: 12px; }
    .field-row .field { flex: 1; }
    .btn { display: inline-block; background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13.5px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn-danger { background: #dc2626; }
    .btn-secondary { background: #64748b; }
    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13.5px; }
    .alert-danger { background: #fee2e2; color: #991b1b; }
    .alert-success { background: #dcfce7; color: #166534; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .badge-active { background: #dcfce7; color: #166534; }
    .badge-deactivated { background: #f1f5f9; color: #64748b; }
    .muted { color: #64748b; font-size: 12.5px; }
    a.link { color: #2563eb; text-decoration: none; }
    nav.tabs { display: flex; gap: 4px; }
    nav.tabs a { color: #cbd5e1; text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13.5px; font-weight: 600; }
    nav.tabs a:hover { background: #334155; color: #fff; }
    .header-left { display: flex; align-items: center; gap: 20px; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="/admin">licence-product</a>
      {{if .LoggedIn}}
      <nav class="tabs">
        <a href="/admin">Lisensi</a>
        <a href="/admin/products">Produk</a>
        <a href="/admin/customers">Customer</a>
      </nav>
      {{end}}
    </div>
    {{if .LoggedIn}}<form method="post" action="/admin/logout"><button type="submit">Logout</button></form>{{end}}
  </header>
  <main>
    {{if .Alert}}<div class="alert alert-{{.AlertKind}}">{{.Alert}}</div>{{end}}
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
